# aizho.me — statik site (Vibes), git ile VPS'te build edilir.
# VPS'te: /etc/nginx/sites-available/aizho.me olarak kopyalanır.
# Mevcut bloklara (default, solideavenfit.com) dokunmaz; nginx domaine göre ayırır.
server {
    listen 80;
    listen [::]:80;
    server_name aizho.me www.aizho.me;

    # repo: /var/www/aizho  ->  build çıktısı: out/
    root /var/www/aizho/out;
    index index.html;

    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    # statik varlıkları uzun süre cache'le
    location /_next/static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
