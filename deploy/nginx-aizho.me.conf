# aizho.me — statik site (Vibes), git ile VPS'te build edilir.
# VPS yolu: /etc/nginx/sites-available/aizho.me  (sites-enabled'a symlink).
# Sertifika: acme.sh (Let's Encrypt) — VPS OpenVZ/Virtuozzo olduğu için
# snap/certbot çalışmaz; cert /etc/nginx/ssl/aizho.me/ altında.
# Mevcut bloklara (default, solideavenfit.com) dokunmaz; nginx domaine göre ayırır.

server {
    listen 80;
    listen [::]:80;
    server_name aizho.me www.aizho.me;

    # acme.sh webroot yenilemesi bu yoldan geçer (redirect'ten önce eşleşir)
    location /.well-known/acme-challenge/ { root /var/www/aizho/out; }

    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name aizho.me www.aizho.me;

    ssl_certificate     /etc/nginx/ssl/aizho.me/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/aizho.me/key.pem;

    # sıkıştırma — JS/CSS gzip'lenmezse ilk yükleme yavaş & "kare kare" olur
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_vary on;
    gzip_types text/css application/javascript application/json image/svg+xml application/xml;

    # repo: /var/www/aizho  ->  build çıktısı: out/
    root /var/www/aizho/out;
    index index.html;

    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    location /_next/static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
