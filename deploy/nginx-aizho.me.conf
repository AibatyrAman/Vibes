# aizho.me — DİNAMİK (PM2 ile `next start`, port 3005). Admin + SQLite için.
# VPS: /etc/nginx/sites-available/aizho.me  (sites-enabled'a symlink).
# SSL: acme.sh (Let's Encrypt) — cert /etc/nginx/ssl/aizho.me/.
# Mevcut bloklara (default, solideavenfit.com) dokunmaz.

server {
    listen 80;
    listen [::]:80;
    server_name aizho.me www.aizho.me;
    # acme.sh yenilemesi buradan geçer (mevcut webroot: /var/www/aizho/out)
    location /.well-known/acme-challenge/ { root /var/www/aizho/out; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name aizho.me www.aizho.me;

    ssl_certificate     /etc/nginx/ssl/aizho.me/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/aizho.me/key.pem;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/css application/javascript application/json image/svg+xml application/xml;

    # Site /vibes altında (Next basePath). Apex ve eski yolları menüye/admine yönlendir.
    location = /        { return 301 https://$host/vibes/menu; }
    location = /vibes   { return 301 https://$host/vibes/menu; }
    location = /admin   { return 301 https://$host/vibes/admin; }

    # Next.js sunucusuna (PM2, 127.0.0.1:3005) proxy — /vibes/* dahil her şey
    location / {
        proxy_pass http://127.0.0.1:3005;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
    }
}
